<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Catch Board | Redgrass Tackle</title><style>:root{color-scheme:light;--ink:#172d23;--paper:#f4f1e7;--line:#d5dbcf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,sans-serif}main{max-width:1100px;margin:auto;padding:54px 42px}header{max-width:720px;margin-bottom:32px}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:700}h2{font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.035em;margin:16px 0}p{margin:12px 0}.muted{color:#526356}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}.card,.empty{padding:28px;border:1px solid var(--line);border-radius:4px;background:#fff}.empty{background:transparent;min-height:220px;display:grid;align-content:center}.tag{font-size:11px;letter-spacing:.14em;font-weight:700;color:#55705e}h3{font-size:24px;line-height:1.2;margin:14px 0}dl{display:grid;grid-template-columns:100px 1fr;gap:7px 14px;margin:18px 0}dt{color:#526356}dd{margin:0}button,a.action{display:inline-block;border:1px solid var(--ink);border-radius:3px;padding:13px 20px;background:var(--ink);color:#fff;cursor:pointer;font:700 12px Arial;letter-spacing:.08em;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #ad713d;outline-offset:4px}img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.note{border-top:1px solid var(--line);padding-top:22px;margin-top:30px;font-size:13px;color:#526356}dialog{border:0;max-width:860px;width:90vw;padding:20px;background:var(--paper)}dialog::backdrop{background:#08150fdd}dialog img{max-height:65vh;object-fit:contain;aspect-ratio:auto}dialog button{float:right;margin-bottom:15px}@media(max-width:600px){main{padding:32px 22px}.cards{grid-template-columns:1fr}.card,.empty{padding:22px}dl{grid-template-columns:80px 1fr}}</style><main><header><p class="eyebrow">THE CATCH BOARD</p><h2>Good days deserve a place here.</h2><p class="muted">Approved customer catches, shared with permission. Open any photo to see the story.</p></header><div class="cards" aria-live="polite"></div><p class="note">Every submission is reviewed before display. Email addresses are never shown in this gallery. Sending a catch does not subscribe you to marketing.</p></main><dialog aria-label="Catch photo and details"><button type="button">CLOSE PHOTO</button><div class="detail"></div></dialog><script>// Add only reviewed records with permission: {approved:true,displayPermission:true,name,photo,photoAlt,lake,bait,description,date}. Do not include email addresses.
const records=[];
const root=document.querySelector('.cards');function el(t,c,v){const n=document.createElement(t);if(c)n.className=c;if(v!==undefined)n.textContent=v;return n}function image(src,alt){const n=el('img');n.src=src;n.alt=alt;n.loading='lazy';return n}function field(dl,label,value){dl.append(el('dt','',label),el('dd','',value))}function link(url,label){const a=el('a','action',label);a.href=url;a.target='_top';return a}
const modal=document.querySelector('dialog');const close=()=>modal.close();modal.querySelector('button').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close()});for(const item of records){if(!item.approved||!item.displayPermission||!item.name||!item.photo)continue;const c=el('article','card');const b=el('button','', 'OPEN CATCH');b.setAttribute('aria-label','Open '+item.name+' catch photo');b.addEventListener('click',()=>{const box=modal.querySelector('.detail');box.replaceChildren(image(item.photo,item.photoAlt||'Catch shared by '+item.name),el('h3','',item.name));for(const k of ['lake','bait','description','date'])if(item[k])box.append(el('p','',item[k]));modal.showModal()});c.append(image(item.photo,item.photoAlt||'Catch shared by '+item.name),el('h3','',item.name));if(item.lake)c.append(el('p','muted',item.lake));c.append(b);root.append(c)}
if(!root.children.length){const e=el('article','empty');e.append(el('span','tag','UNPUBLISHED DRAFT'),el('h3','',"Your catch could be the first."),el('p','muted',"The gallery is awaiting owner-approved customer photos. Submit below for private review."));root.append(e)}</script></html>
