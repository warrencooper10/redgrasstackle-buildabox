name: Validate Redgrass Top 10
on:
  push:
    paths:
      - "assets/data/top10.json"
      - "assets/data/top10.schema.json"
      - "assets/data/baits.json"
      - "assets/images/**"
      - "scripts/validate-top10.cjs"
      - "scripts/test-top10.mjs"
      - "wix/top10-loader.js"
      - ".github/workflows/validate-top10.yml"
  pull_request:
    paths:
      - "assets/data/top10.json"
      - "assets/data/top10.schema.json"
      - "assets/data/baits.json"
      - "assets/images/**"
      - "scripts/**"
      - "wix/top10-loader.js"
      - ".github/workflows/validate-top10.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-top10.cjs
      - run: node scripts/test-top10.mjs
