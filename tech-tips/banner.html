<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech Tips Banner | Redgrass</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14241d;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}
a{color:inherit;text-decoration:none}.banner{position:relative;display:flex;min-height:315px;height:100%;width:100%;overflow:hidden;align-items:center;justify-content:center;text-align:center;isolation:isolate}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.poster{position:absolute;inset:0;z-index:-3;background:linear-gradient(115deg,#2d4235,#111d18 65%,#34493a)}
.tint{position:absolute;inset:0;background:linear-gradient(115deg,rgba(13,45,26,.80),rgba(18,53,34,.66));z-index:-1}
.content{padding:45px 25px;max-width:930px;filter:drop-shadow(0px 2px 3px #0005)}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#d1dfbb}.title{font-size:clamp(38px,7vw,72px);font-weight:900;letter-spacing:.035em;margin:8px 0 6px}
.subtitle{font-size:clamp(14px,2.3vw,19px);color:#edf4e8;margin:0 auto 20px}
.cta{display:inline-flex;border:1px solid #cfdfbc;padding:11px 24px;border-radius:4px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;font-size:12px;background:#d1dfbf;color:#193124}
.banner:hover .cta,.banner:focus-visible .cta{background:#fff}
.banner:focus-visible{outline:3px solid #f9d87c;outline-offset:-3px}
@media (prefers-reduced-motion:reduce){video{display:none}}@media(max-width:640px){.banner{min-height:250px}.subtitle{max-width:340px}}
</style></head><body><a class="banner" href="./" target="_top" aria-label="Open Redgrass Tech Tips subpage">
<!-- Video: default media/boat-loop.mp4, or ?video=ENCODED_HTTPS_MP4_URL to choose a source without editing code. Wix installation uses a native transparent page-link overlay; no domain move is required. -->
<video id="loop" autoplay muted loop playsinline preload="metadata" aria-hidden="true"><source src="./media/boat-loop.mp4" type="video/mp4"></video>
<div class="poster"></div><div class="tint"></div>
<div class="content"><div class="eyebrow">Learn more · Fish smarter</div><div class="title">TECH TIPS</div><p class="subtitle">Fishing techniques, rigging, boat repairs, and know-how from the water to the workshop.</p><span class="cta">Explore Tech Tips →</span></div></a>
<script>
const params = new URLSearchParams(location.search);
const chosenVideo = params.get('video');
// Wix owns same-tab routing through its native full-size transparent link.
if (params.get('overlay') === '1') {
  const banner = document.querySelector('.banner');
  banner.removeAttribute('href');
  banner.removeAttribute('target');
}
const player = document.getElementById('loop');
if (chosenVideo) {
  try {
    const u = new URL(chosenVideo);
    if (u.protocol === 'https:' && /\.(mp4|webm)(?:$|[?#])/i.test(u.href)) {
      player.querySelector('source').src = u.href;
      player.load();
    }
  } catch (_) { /* Keep bundled/default source */ }
}
player.addEventListener('error', () => { player.hidden = true; });
player.addEventListener('loadeddata', () => {
  if (player.duration > 8 || player.duration < 4) console.warn('Recommended boat loop: 5–7 seconds.');
});
</script>
</body></html>
