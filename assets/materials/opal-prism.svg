<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="224" viewBox="0 0 1440 224" preserveAspectRatio="none">
  <title>Light refracted through smoked opal glass</title>
  <defs>
    <radialGradient id="ground" cx="76%" cy="23%" r="77%" gradientTransform="translate(0 .13) scale(1 .66)">
      <stop stop-color="#373940"/>
      <stop offset=".52" stop-color="#1d1f25"/>
      <stop offset="1" stop-color="#101216"/>
    </radialGradient>
    <linearGradient id="horizon" x1="18%" y1="82%" x2="87%" y2="0%">
      <stop stop-color="#121418" stop-opacity="0"/>
      <stop offset=".57" stop-color="#424750"/>
      <stop offset=".85" stop-color="#22242b"/>
      <stop offset="1" stop-color="#5e5d64"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="97%" y2="100%">
      <stop stop-color="#a2a4a6" stop-opacity=".52"/>
      <stop offset=".19" stop-color="#434650" stop-opacity=".32"/>
      <stop offset=".54" stop-color="#24262e"/>
      <stop offset=".83" stop-color="#797a84"/>
      <stop offset="1" stop-color="#b2aeba"/>
    </linearGradient>
    <linearGradient id="lens" x1="27%" y1="86%" x2="91%" y2="0%">
      <stop stop-color="#9896a7"/>
      <stop offset=".26" stop-color="#414550"/>
      <stop offset=".53" stop-color="#22252b"/>
      <stop offset=".84" stop-color="#555961"/>
      <stop offset="1" stop-color="#8e9196"/>
    </linearGradient>
    <linearGradient id="return" x1="0" y1="100%" x2="100%" y2="0">
      <stop stop-color="#30323b"/>
      <stop offset=".42" stop-color="#535763"/>
      <stop offset=".69" stop-color="#1d2027"/>
      <stop offset="1" stop-color="#666975"/>
    </linearGradient>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x1="590" y1="0" x2="1425" y2="145">
      <stop stop-color="#d7d4ce" stop-opacity="0"/>
      <stop offset=".25" stop-color="#9c9da5" stop-opacity=".65"/>
      <stop offset=".46" stop-color="#edf1ee"/>
      <stop offset=".57" stop-color="#9199a6" stop-opacity=".34"/>
      <stop offset=".72" stop-color="#cad7da" stop-opacity=".82"/>
      <stop offset=".85" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#a4a9b3" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="966" y1="107" x2="1316" y2="6">
      <stop stop-color="#87b6d3" stop-opacity="0"/>
      <stop offset=".20" stop-color="#a9e0e0"/>
      <stop offset=".28" stop-color="#e1daf5"/>
      <stop offset=".37" stop-color="#f1bacc" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#a59bd0" stop-opacity="0"/>
      <stop offset=".67" stop-color="#a5bedb" stop-opacity=".38"/>
      <stop offset=".82" stop-color="#c6e8dc"/>
      <stop offset=".90" stop-color="#f1e5c8"/>
      <stop offset="1" stop-color="#d4b7e1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dispersion" gradientUnits="userSpaceOnUse" x1="1143" y1="55" x2="1166" y2="96">
      <stop stop-color="#a0cfeb" stop-opacity="0"/>
      <stop offset=".22" stop-color="#93d8e4" stop-opacity=".48"/>
      <stop offset=".38" stop-color="#b7eee0" stop-opacity=".74"/>
      <stop offset=".48" stop-color="#fff4de" stop-opacity=".85"/>
      <stop offset=".62" stop-color="#eac2d9" stop-opacity=".76"/>
      <stop offset=".78" stop-color="#baa8e3" stop-opacity=".48"/>
      <stop offset="1" stop-color="#b2a2df" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glint">
      <stop stop-color="#fff9eb"/>
      <stop offset=".15" stop-color="#f5efff" stop-opacity=".7"/>
      <stop offset=".42" stop-color="#a0c9dd" stop-opacity=".28"/>
      <stop offset="1" stop-color="#a0c9dd" stop-opacity="0"/>
    </radialGradient>
    <filter id="diffuse" x="-.25" y="-.7" width="1.5" height="2.4" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="primary-face"><path d="m1047 88 260-88-68 97-150 46z"/></clipPath>
    <clipPath id="return-face"><path d="m1089 143 150-46 201 28-206 99H936z"/></clipPath>
  </defs>
  <path fill="url(#ground)" d="M0 0h1440v224H0z"/>
  <!-- Shaded faces under the polished bevels. -->
  <path fill="url(#horizon)" d="M0 0h634l413 88-74 46L380 162 0 123z"/>
  <path fill="url(#fold)" d="M634 0h400l13 88z"/>
  <path fill="#252730" d="M1034 0h273l-260 88z"/>
  <path fill="url(#lens)" d="m1047 88 260-88-68 97-150 46z"/>
  <path fill="url(#fold)" d="M1307 0h133v46l-201 51z"/>
  <path fill="#181b20" d="m1239 97 201-51v79z"/>
  <path fill="url(#return)" d="m1089 143 150-46 201 28-206 99H936z"/>
  <path fill="#656975" opacity=".39" d="m634 0 413 88 42 55-116-9z"/>
  <!-- Refracted light enters on one face, then returns at an oblique angle. -->
  <g clip-path="url(#primary-face)">
    <path fill="url(#fire)" opacity=".73" filter="url(#diffuse)" d="m1007 137 87-47 222-84-78 43-129 71z"/>
    <path fill="url(#fire)" opacity=".62" d="m1039 135 58-43 153-52-142 67-33 27z"/>
    <path fill="#e7e2e6" opacity=".35" filter="url(#diffuse)" d="m1100 118 167-87-39 41-111 59z"/>
    <path fill="url(#dispersion)" filter="url(#diffuse)" d="m1066 122 38-51 178-58-89 50-53 45-58 27z"/>
    <path fill="url(#dispersion)" opacity=".72" d="m1067 121 49-46 145-52-111 64-59 39z"/>
    <path fill="#e8f3ec" opacity=".37" d="m1083 119 38-41 78-26-70 37z"/>
    <path fill="#14151b" opacity=".54" d="m1110 128 140-54-12 23-149 46z"/>
  </g>
  <g clip-path="url(#return-face)">
    <path fill="url(#fire)" opacity=".57" filter="url(#diffuse)" d="m1008 167 226-75 55 21-114 13-164 58z"/>
    <path fill="#e9e2ef" opacity=".18" d="m1065 159 174-62 83 11-67-2z"/>
    <path fill="url(#fire)" opacity=".65" d="m1142 131 97-34 27 4-26 4-82 25z"/>
  </g>
  <!-- Paired bevel faces and their offset reflected seams. -->
  <path fill="#a8a8b5" opacity=".49" d="m640 0 407 88 260-88h14l-271 95z"/>
  <path fill="#14161c" opacity=".82" d="m654 6 396 89 39 48-46-44z"/>
  <path fill="url(#fire)" opacity=".78" d="m1037 79 10 9 260-88-25 11-231 86-6-5z"/>
  <path fill="#b4b9c6" opacity=".61" d="m1089 143 150-46 201 28v5l-199-28-149 47z"/>
  <path fill="#0b0e14" opacity=".71" d="m1089 143-116-9-42 7 161 8z"/>
  <path fill="#b7b7c1" opacity=".18" d="m1243 97 197-51v3l-192 52z"/>
  <g fill="none" stroke-linejoin="round">
    <path stroke="url(#seam)" stroke-width="1.6" d="m634 0 413 88 260-88m-260 88 42 55 150-46 201 28m-201-28 201-51m-351 97-116-9L380 162"/>
    <path stroke="url(#seam)" stroke-width=".85" d="m667 8 383 87 40 51 150-47 200 29m-202-31 69-97m-273 0 13 88"/>
    <path stroke="url(#fire)" stroke-width="2.2" d="m968 72 79 16 177-60m-135 115 150-46 61 8"/>
  </g>
  <ellipse fill="url(#glint)" cx="1048" cy="88" rx="53" ry="18" transform="rotate(16 1048 88)" opacity=".74"/>
  <ellipse fill="url(#glint)" cx="1239" cy="97" rx="55" ry="13" transform="rotate(-28 1239 97)" opacity=".74"/>
  <ellipse fill="url(#glint)" cx="1297" cy="5" rx="77" ry="15" transform="rotate(-18 1297 5)" opacity=".66"/>
  <path fill="none" stroke="#fff7eb" stroke-opacity=".73" stroke-width=".9" d="m1025 83 22 5 26-9m149 23 17-5 16 2"/>
</svg>
